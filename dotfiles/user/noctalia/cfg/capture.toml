# Capture intégrée à Noctalia : aucune commande ou application tierce.
[shell.screenshot]
copy_to_clipboard = true
save_to_file = false
pipe_to_command = false
# Figer l'image facilite la sélection ; valider la région avant la copie.
freeze_screen = true
confirm_region = true
show_region_hint = true
show_region_dimensions = true
