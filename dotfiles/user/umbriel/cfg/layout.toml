[layout]
mode = "scrolling"
gap = 8
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5
# Centrer un petit groupe et garder lisible une colonne devenue trop large
# pour rester affichée avec sa voisine ; l'aperçu recentre la sélection.
center_underfull_strip = true
center_focused = "on_overflow"
center_on_overview_select = true
